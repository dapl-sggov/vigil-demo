name: Secret scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Domingo às 03:00 UTC · ronda semanal independente de pushes
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  gitleaks:
    name: Scan repository for leaked credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configuração padrão da action procura ficheiro .gitleaks.toml na raiz;
          # se ausente usa as regras built-in (Anthropic, OpenAI, AWS, GitHub PAT,
          # Slack, etc.). Manter sem licença GITLEAKS_LICENSE — a action é
          # gratuita para repositórios públicos.

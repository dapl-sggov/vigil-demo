name: Acessibilidade (WCAG 2.1 AA)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  axe:
    name: axe-core via Puppeteer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python 3 (servidor estático)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm install

      - name: Run accessibility audit
        run: npm run a11y

      - name: Upload report artefact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            scripts/*.log
          if-no-files-found: ignore

name: SBOM (Software Bill of Materials)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Gera um SBOM em CycloneDX 1.5 a cada push para main.
# Aplicação directa: este repo tem apenas devDependencies (puppeteer, axe-core)
# mas o workflow está pré-configurado para o repositório `vigil` (código real)
# quando este existir — basta copiar o ficheiro mantendo a mesma estrutura.

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft scan dir:. \
            --exclude './node_modules/**/test/**' \
            --exclude './.git/**' \
            -o cyclonedx-json=sbom.cyclonedx.json \
            -o spdx-json=sbom.spdx.json

      - name: Upload SBOM artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
          retention-days: 90

      - name: Generate vulnerability report (grype)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom:sbom.cyclonedx.json --fail-on high -o table > grype-report.txt || true
          cat grype-report.txt

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-${{ github.sha }}
          path: grype-report.txt
          retention-days: 90

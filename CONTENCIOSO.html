<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIL · CONTENCIOSO · Restrito</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Atkinson Hyperlegible',Arial,sans-serif;
  --font-display:'Fraunces',Georgia,serif;
  --font-mono:'JetBrains Mono',Menlo,Consolas,monospace;
  --ink:#1A1815;--ink-2:#3D3A35;--ink-3:#6E6A62;--ink-4:#9A958B;
  --line:#D8D2BF;--line-2:#C2BBA5;
  --paper:#F5F1E8;--paper-2:#FBF8F1;--paper-3:#EDE7D8;--paper-4:#E3DDC9;
  --bg:var(--paper);--bg2:var(--paper-2);--bg3:var(--paper-3);--bg4:var(--paper-4);
  --green:#0E7433;--green-dark:#063D1B;--green-soft:#DCE8DE;
  --blue:#2B5683;
  --red:#A8170E;--red-soft:#F0DAD7;
  --amber:#A86E10;
  --tint-green:rgba(14,116,51,0.12);
  --tint-amber:rgba(168,110,16,0.14);
  --tint-red:rgba(168,23,14,0.12);
  --tint-blue:rgba(43,86,131,0.12);
  --sh-md:0 8px 24px rgba(26,24,21,0.10);
  --r:4px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.5;}
strong,b{font-weight:700;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-display);letter-spacing:-0.015em;color:var(--ink);}

.skip{position:absolute;top:-100px;left:0;padding:0.7rem 1rem;background:var(--ink);color:var(--paper);font-weight:700;z-index:999;text-decoration:none;}
.skip:focus{top:0;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

.shell{max-width:1280px;margin:0 auto;padding:1.4rem 1.6rem 4rem;}
.site-hdr{display:flex;align-items:center;gap:0.85rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:2px solid var(--ink);}
.brand-mark{width:34px;height:34px;background:var(--red);border-radius:var(--r);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--paper);}
.brand-mark svg{width:20px;height:20px;}
.brand-bd{flex:1;min-width:0;}
.brand-nm{font-family:var(--font-display);font-weight:900;font-size:1.15rem;letter-spacing:-0.025em;color:var(--ink);}
.brand-sub{font-size:0.72rem;color:var(--ink-3);margin-top:0.1rem;letter-spacing:0.02em;}
.brand-link{font-size:0.74rem;color:var(--ink);text-decoration:none;font-weight:700;padding:0.35rem 0.65rem;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper-2);margin-right:0.55rem;}
.brand-link:hover{background:var(--paper-3);}
.user-chip{display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0.6rem 0.3rem 0.35rem;background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);}
.avatar-sm{width:26px;height:26px;border-radius:50%;background:var(--red);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:700;font-family:var(--font-display);}
.user-name-sm{font-size:0.74rem;font-weight:700;color:var(--ink-2);}

.classified-banner{background:repeating-linear-gradient(45deg,var(--red-soft),var(--red-soft) 10px,#F8D3D0 10px,#F8D3D0 20px);border:1px solid var(--red);border-left:4px solid var(--red);border-radius:0 var(--r) var(--r) 0;padding:0.95rem 1.2rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.75rem;font-family:var(--font-display);font-size:0.88rem;color:var(--red);font-weight:800;letter-spacing:0.04em;text-transform:uppercase;}
.classified-banner svg{width:20px;height:20px;flex-shrink:0;}

.access-denied{padding:3rem 2rem;text-align:center;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);}
.access-denied h2{font-family:var(--font-display);font-size:1.5rem;font-weight:900;margin-bottom:0.85rem;color:var(--red);letter-spacing:-0.02em;}
.access-denied p{color:var(--ink-3);max-width:520px;margin:0 auto 1.6rem;line-height:1.55;}

.hero{padding:1.2rem 0 1.5rem;}
.hero-eye{font-family:var(--font-display);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--red);font-weight:800;margin-bottom:0.55rem;}
.hero-h1{font-family:var(--font-display);font-size:2.4rem;font-weight:900;letter-spacing:-0.035em;margin-bottom:0.7rem;line-height:1.02;color:var(--ink);}
.hero-sub{font-size:0.96rem;color:var(--ink-2);max-width:760px;line-height:1.55;}

/* Risk dashboard */
.risk-dash{display:grid;grid-template-columns:repeat(4,1fr);gap:0.85rem;margin-bottom:1.5rem;}
.risk-card{padding:1rem 1.1rem;background:var(--bg2);border:1px solid var(--line);border-radius:10px;}
.risk-card.alert{background:var(--tint-red);border-color:var(--red);}
.risk-card-lb{font-size:0.66rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-4);font-weight:600;margin-bottom:0.5rem;}
.risk-card.alert .risk-card-lb{color:var(--red);}
.risk-card-vl{font-size:1.7rem;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-0.02em;}
.risk-card.alert .risk-card-vl{color:var(--red);}
.risk-card-dt{font-size:0.7rem;color:var(--ink-3);margin-top:0.45rem;}

/* List of contencioso */
.cases{display:flex;flex-direction:column;gap:0.7rem;}
.case{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.case-h{padding:1rem 1.2rem;display:flex;gap:1rem;align-items:flex-start;cursor:pointer;}
.case-h:hover{background:var(--bg3);}
.case-status{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:0.4rem;}
.case-status.acordao{background:var(--red);}
.case-status.parecer{background:var(--amber);}
.case-status.notificacao{background:var(--blue);}
.case-status.dialogo{background:var(--ink-4);}
.case-bd{flex:1;}
.case-celex{font-family:var(--font-mono);font-size:0.74rem;color:var(--red);font-weight:600;margin-bottom:0.2rem;}
.case-ti{font-size:1rem;font-weight:600;color:var(--ink);margin-bottom:0.3rem;line-height:1.3;}
.case-meta{font-size:0.74rem;color:var(--ink-3);}
.case-rt{display:flex;flex-direction:column;align-items:flex-end;gap:0.3rem;}
.case-fase-pill{font-size:0.7rem;padding:0.25rem 0.6rem;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
.fase-acordao{background:var(--red);color:#fff;}
.fase-parecer{background:var(--tint-amber);color:var(--amber);}
.fase-notificacao{background:var(--tint-blue);color:var(--blue);}
.fase-dialogo{background:var(--bg4);color:var(--ink-3);}
.case-sancao{font-family:var(--font-mono);font-size:0.74rem;color:var(--red);font-weight:500;}
.case-arrow{align-self:center;color:var(--ink-4);transition:transform 0.18s;}
.case.open .case-arrow{transform:rotate(90deg);}

.case-body{display:none;padding:0 1.2rem 1.3rem;border-top:1px solid var(--line);}
.case.open .case-body{display:block;}

.section-h{font-size:0.74rem;font-weight:700;color:var(--ink);margin:1.3rem 0 0.7rem;text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;gap:0.5rem;}
.section-h::before{content:"";width:3px;height:14px;background:var(--red);border-radius:2px;}

/* 6-phase pipeline */
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:0.4rem;}
.phase{padding:0.65rem 0.7rem;background:var(--bg3);border-radius:6px;text-align:center;position:relative;}
.phase.done{background:var(--tint-green);}
.phase.cur{background:var(--red);color:#fff;}
.phase-n{font-size:0.6rem;color:var(--ink-4);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:0.2rem;}
.phase.cur .phase-n{color:rgba(255,255,255,0.75);}
.phase.done .phase-n{color:var(--green);}
.phase-nm{font-size:0.72rem;font-weight:600;color:var(--ink);}
.phase.cur .phase-nm{color:#fff;}
.phase-dt{font-family:var(--font-mono);font-size:0.62rem;color:var(--ink-3);margin-top:0.25rem;}
.phase.cur .phase-dt{color:rgba(255,255,255,0.85);}

/* Pieces table */
.pieces{display:flex;flex-direction:column;gap:0.4rem;}
.piece{display:grid;grid-template-columns:90px 1fr 110px 100px 24px;gap:0.6rem;padding:0.55rem 0.75rem;background:var(--bg3);border-radius:6px;align-items:center;font-size:0.78rem;}
.piece-dt{font-family:var(--font-mono);font-size:0.7rem;color:var(--ink-3);}
.piece-ti{color:var(--ink);font-weight:500;}
.piece-cls{font-size:0.6rem;text-transform:uppercase;padding:0.15rem 0.45rem;border-radius:3px;font-weight:600;letter-spacing:0.04em;text-align:center;}
.cls-reservado{background:var(--tint-red);color:var(--red);}
.cls-publico{background:var(--tint-green);color:var(--green);}
.cls-confidencial{background:#FFEFD5;color:var(--red);}
.piece-hash{font-family:var(--font-mono);font-size:0.62rem;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.piece-link{color:var(--green);text-decoration:none;display:flex;align-items:center;justify-content:center;}
.piece-link svg{width:14px;height:14px;}

/* Audit trail */
.audit{display:flex;flex-direction:column;gap:0.35rem;font-size:0.74rem;}
.audit-it{display:flex;gap:0.7rem;padding:0.45rem 0.7rem;background:var(--bg3);border-radius:5px;font-family:var(--font-mono);}
.audit-ts{color:var(--ink-3);min-width:120px;}
.audit-actor{color:var(--ink);font-weight:600;}
.audit-action{color:var(--ink-2);}

/* Cost calc */
.cost-row{display:grid;grid-template-columns:1fr 130px;gap:1rem;padding:0.55rem 0;font-size:0.84rem;border-bottom:1px solid var(--line);}
.cost-row:last-child{border-bottom:none;}
.cost-row.total{font-weight:700;font-size:0.95rem;color:var(--red);padding-top:0.95rem;border-top:2px solid var(--red);border-bottom:none;}

.brand-link{color:var(--ink);}

/* Toolbar (tabs + relatório) */
.cont-toolbar{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:1.2rem;}
.tab-btn{font-family:var(--font);font-size:0.8rem;font-weight:700;padding:0.5rem 0.9rem;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper-2);color:var(--ink-2);cursor:pointer;}
.tab-btn.cur{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.tab-btn:hover:not(.cur){background:var(--paper-3);}
.report-btn{margin-left:auto;font-family:var(--font);font-size:0.8rem;font-weight:700;padding:0.5rem 0.9rem;border:1px solid var(--green);border-radius:var(--r);background:var(--green);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:0.4rem;}
.report-btn:hover{background:var(--green-dark);}
.report-btn svg{width:15px;height:15px;}

/* Category bar (9 categorias) */
.cat-bar{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1.2rem;}
.cat-chip{font-size:0.72rem;font-weight:600;padding:0.35rem 0.65rem;border-radius:999px;border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:0.4rem;}
.cat-chip:hover{background:var(--paper-3);}
.cat-chip.cur{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.cat-chip .n{font-family:var(--font-mono);font-size:0.66rem;background:rgba(0,0,0,0.08);padding:0.05rem 0.35rem;border-radius:999px;}
.cat-chip.cur .n{background:rgba(255,255,255,0.2);}

/* Category section header in list */
.cat-section{font-family:var(--font-display);font-size:0.82rem;font-weight:800;color:var(--ink);margin:1.4rem 0 0.6rem;padding-bottom:0.3rem;border-bottom:1px solid var(--line-2);letter-spacing:-0.01em;display:flex;align-items:center;gap:0.5rem;}
.cat-section .roman{font-size:0.7rem;background:var(--ink);color:var(--paper);padding:0.1rem 0.45rem;border-radius:3px;font-family:var(--font-mono);font-weight:600;}
.cat-section .cnt{margin-left:auto;font-size:0.68rem;color:var(--ink-3);font-weight:600;}

/* Participation pill */
.part-pill{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.04em;padding:0.12rem 0.4rem;border-radius:3px;font-weight:700;}
.part-reu{background:var(--tint-red);color:var(--red);}
.part-interveniente{background:var(--tint-blue);color:var(--blue);}
.part-observacoes{background:var(--bg4);color:var(--ink-3);}
.part-recorrente,.part-recorrido{background:var(--tint-amber);color:var(--amber);}

.fase-reenvio{background:var(--tint-blue);color:var(--blue);}
.fase-recurso{background:var(--tint-amber);color:var(--amber);}
.fase-aguarda{background:var(--bg4);color:var(--ink-3);}

/* SEAE report modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(26,24,21,0.55);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:2.5rem 1.5rem;overflow-y:auto;}
.modal-backdrop.on{display:flex;}
.report-modal{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);max-width:840px;width:100%;box-shadow:var(--sh-md);}
.report-hd{display:flex;align-items:center;gap:0.8rem;padding:1.1rem 1.4rem;border-bottom:2px solid var(--ink);}
.report-hd h2{font-family:var(--font-display);font-size:1.15rem;font-weight:900;flex:1;letter-spacing:-0.02em;}
.report-hd .x{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink-3);line-height:1;}
.report-controls{padding:1rem 1.4rem;background:var(--paper-3);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:0.7rem;flex-wrap:wrap;}
.report-controls label{font-size:0.78rem;font-weight:700;color:var(--ink-2);}
.report-controls select{font-family:var(--font);font-size:0.82rem;padding:0.4rem 0.6rem;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper-2);color:var(--ink);}
.report-body{padding:1.4rem;max-height:62vh;overflow-y:auto;}
.report-doc{background:#fff;border:1px solid var(--line);padding:1.6rem 1.8rem;font-size:0.82rem;line-height:1.55;}
.report-doc h3{font-family:var(--font-display);font-size:1rem;font-weight:900;text-transform:uppercase;letter-spacing:0.02em;border-bottom:2px solid var(--ink);padding-bottom:0.4rem;margin:1.3rem 0 0.7rem;}
.report-doc h3:first-child{margin-top:0;}
.report-doc h4{font-size:0.82rem;font-weight:700;color:var(--ink-2);margin:0.9rem 0 0.4rem;}
.report-doc .rd-meta{font-size:0.72rem;color:var(--ink-3);font-family:var(--font-mono);margin-bottom:1rem;}
.report-doc .rd-row{display:grid;grid-template-columns:130px 1fr;gap:0.8rem;padding:0.45rem 0;border-bottom:1px solid var(--line);}
.report-doc .rd-row .rd-ref{font-family:var(--font-mono);font-size:0.74rem;color:var(--red);font-weight:600;}
.report-doc .rd-empty{color:var(--ink-4);font-style:italic;}
.report-doc .rd-count{display:inline-block;background:var(--tint-red);color:var(--red);font-weight:700;padding:0.05rem 0.45rem;border-radius:3px;font-size:0.78rem;margin-left:0.4rem;}
.report-foot{padding:0.9rem 1.4rem;border-top:1px solid var(--line);display:flex;gap:0.5rem;justify-content:flex-end;}
.report-foot button{font-family:var(--font);font-size:0.78rem;font-weight:700;padding:0.5rem 0.9rem;border-radius:var(--r);cursor:pointer;border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink-2);}
.report-foot button.primary{background:var(--green);color:#fff;border-color:var(--green);}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

@media (max-width:900px){.risk-dash{grid-template-columns:1fr 1fr;}.pipeline{grid-template-columns:repeat(2,1fr);}.piece{grid-template-columns:1fr;}.hero-h1{font-size:1.9rem;}}
@media (max-width:600px){.shell{padding:1rem 1.1rem 3rem;}.risk-dash{grid-template-columns:1fr;}.pipeline{grid-template-columns:1fr;}.hero-h1{font-size:1.55rem;}.case-h{flex-direction:column;}.case-rt{align-items:flex-start;}}
</style>
</head>
<body>

<a class="skip" href="#main-content">Saltar para o conteúdo</a>

<div class="shell">

  <header class="site-hdr">
    <div class="brand-mark"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><line x1="10" y1="3" x2="10" y2="17" stroke="currentColor" stroke-width="1.5"/><path d="M5 6h10" stroke="currentColor" stroke-width="1.5"/><path d="M6 6L4 12a3 3 0 0 0 6 0z" fill="currentColor"/><path d="M14 6l-2 6a3 3 0 0 0 6 0z" fill="currentColor"/></svg></div>
    <div class="brand-bd"><div class="brand-nm">VIGIL · CONTENCIOSO</div><div class="brand-sub">M04 · Pré-contencioso e contencioso TJUE · acesso restrito DGDEI</div></div>
    <a href="hub.html" class="brand-link">← Voltar ao Hub</a>
    <div class="user-chip" aria-label="Sessão activa"><div class="avatar-sm" id="avatar" aria-hidden="true">—</div><span class="user-name-sm" id="user-name">—</span></div>
  </header>

  <main id="main-content">
    <div id="content"></div>
  </main>

</div>

<script>
const session = (() => { try { return JSON.parse(localStorage.getItem('vigil-demo-session') || 'null'); } catch(e) { return null; } })();
if (!session) { window.location.href = 'index.html'; }
else {
  const initials = session.name.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('avatar').textContent = initials;
  document.getElementById('user-name').textContent = session.name.split(' ')[0];
}

const ALLOWED = ['tecnico_dgdei','admin_demo'];

if (!ALLOWED.includes(session.perfil)) {
  document.getElementById('content').innerHTML = `
    <div class="access-denied">
      <h2>🔒 Acesso restrito</h2>
      <p>O módulo CONTENCIOSO contém metadados de peças processuais classificadas no mínimo como <strong>Reservado</strong>, ao abrigo da Lei Orgânica n.º 2/2014 (regime do segredo de Estado), da Lei n.º 6/94 (segredo de Estado · diplomas correlatos) e das Instruções para a Segurança Nacional · Salvaguarda e Defesa das Matérias Classificadas (SEGNAC 1, aprovadas pela RCM n.º 50/88, posteriormente revistas). Apenas o perfil DGDEI pode aceder.</p>
      <p>O teu perfil actual é <strong>${session.role}</strong>. Para visualizar dados agregados sem acesso a peças individuais, consulta o módulo GABINETES.</p>
      <a href="hub.html" class="brand-link" style="display:inline-block;padding:0.6rem 1.4rem;background:var(--green);color:#fff;border-radius:7px;text-decoration:none;font-weight:600">← Voltar ao Hub</a>
    </div>
  `;
} else {

// =====================================================================
// TAXONOMIA REAL DGDEI/DUE — 9 categorias de contencioso TJUE
// (origem: Mapa de Contencioso · 03_Especificacao_Tecnica/08)
// =====================================================================
const CATEGORIAS = {
  'I':    { roman:'I',    nome:'Ações de incumprimento contra PT',                    part:'reu' },
  'II':   { roman:'II',   nome:'Ações de incumprimento · intervenção de PT',          part:'interveniente' },
  'III':  { roman:'III',  nome:'Pareceres',                                           part:'observacoes' },
  'IV':   { roman:'IV',   nome:'Recursos de acórdão do Tribunal Geral',               part:'recorrente' },
  'V':    { roman:'V',    nome:'Recursos de anulação TJUE · intervenção',             part:'interveniente' },
  'VI':   { roman:'VI',   nome:'Recursos de anulação · Tribunal Geral',               part:'recorrente' },
  'VII':  { roman:'VII',  nome:'Recursos de anulação Tribunal Geral · intervenção',   part:'interveniente' },
  'VIII': { roman:'VIII', nome:'Reenvio prejudicial · tribunais portugueses',         part:'observacoes' },
  'IX':   { roman:'IX',   nome:'Reenvio prejudicial · tribunais de outros EM',        part:'observacoes' },
};
const PART_LABEL = { reu:'Réu', interveniente:'Intervenção', observacoes:'Observações', recorrente:'Recorrente', recorrido:'Recorrido' };

// =====================================================================
// PROCEDIMENTOS DE INFRAÇÃO (fase administrativa CE · NI → PF → TJUE)
// Distintos do contencioso judicial. Alimentam o reporte à SEAE.
// =====================================================================
const INFRACOES = [
  { ref:'INFR(2024)2038', celex:'32022L2555', mat:'NIS2 · Cibersegurança', motivo:'falta_transposicao',

        <div class="case-status ${inf.fase}"></div>
        <div class="case-bd">
          <div class="case-celex">${inf.ref} · CELEX ${inf.celex}</div>
          <div class="case-ti">${inf.mat}</div>
          <div class="case-meta">${inf.ministerios.join(' · ')} · técnico ${inf.tecnico} · ${motivoLabel}</div>
        </div>
        <div class="case-rt">
          <span class="case-fase-pill ${inf.faseCls}">${inf.faseLabel}</span>
          <span style="font-size:0.66rem;color:var(--ink-3);font-family:var(--font-mono)">prazo ${inf.prazo || '—'}</span>
        </div>
        <svg class="case-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="case-body">
        <div style="font-size:0.84rem;color:var(--ink-2);line-height:1.55;padding-top:1rem">${inf.sintese}</div>
        <div class="section-h">Fase administrativa CE</div>
        <div class="pipeline" style="grid-template-columns:repeat(4,1fr)">
          <div class="phase ${inf.dataNI?'done':''}"><div class="phase-n">NI</div><div class="phase-nm">Notif. p/ Cumprir</div><div class="phase-dt">${inf.dataNI||'—'}</div></div>
          <div class="phase ${inf.dataPF?(inf.fase==='parecer_fundamentado'?'cur':'done'):''}"><div class="phase-n">PF</div><div class="phase-nm">Parecer Fund.</div><div class="phase-dt">${inf.dataPF||'—'}</div></div>
          <div class="phase ${inf.fase==='recurso_tjue'?'cur':''}"><div class="phase-n">TJUE</div><div class="phase-nm">Ação no tribunal</div><div class="phase-dt">—</div></div>
          <div class="phase ${inf.fase==='aguarda_arquivamento'||inf.fase==='arquivado'?'cur':''}"><div class="phase-n">ARQ</div><div class="phase-nm">Arquivamento</div><div class="phase-dt">—</div></div>
        </div>
        <div class="section-h">Ponto de situação</div>
        <div class="cost-row"><span>Situação no circuito legislativo</span><span style="text-align:right">${inf.pontoSit}</span></div>
        <div class="cost-row"><span>Scoreboard CE</span><span style="text-align:right">${inf.scoreboard}</span></div>
        <div class="cost-row"><span>Síntese da resposta de PT</span><span style="text-align:right">${inf.sintese}</span></div>
        <div class="cost-row total"><span>Risco financeiro</span><span style="text-align:right;font-family:var(--font-mono)">${inf.risco}</span></div>
      </div>
    </div>`;
}

function renderCatBar() {
  if (curTab !== 'cont') { document.getElementById('cat-bar-wrap').innerHTML = ''; return; }
  const chips = ['todas', ...catsPresentes].map(k => {
    if (k === 'todas') {
      return `<button class="cat-chip ${curCat==='todas'?'cur':''}" onclick="setCat('todas')">Todas <span class="n">${CASES.length}</span></button>`;
    }
    const cat = CATEGORIAS[k];
    return `<button class="cat-chip ${curCat===k?'cur':''}" onclick="setCat('${k}')" title="${cat.nome}">${cat.roman} · ${cat.nome.length>34?cat.nome.slice(0,32)+'…':cat.nome} <span class="n">${catCounts[k]}</span></button>`;
  }).join('');
  document.getElementById('cat-bar-wrap').innerHTML = `<div class="cat-bar">${chips}</div>`;
}

function renderList() {
  const wrap = document.getElementById('cont-list');
  if (curTab === 'infr') {
    wrap.innerHTML = `<div class="cases">${INFRACOES.map((inf,i)=>infracaoCardHTML(inf, i===0)).join('')}</div>`;
    return;
  }
  // Contencioso: agrupar por categoria (ou filtrar)
  const cats = curCat === 'todas' ? catsPresentes : [curCat];
  let html = '';
  cats.forEach(k => {
    const cat = CATEGORIAS[k];
    const list = CASES.filter(c => c.cat === k);
    if (!list.length) return;
    html += `<div class="cat-section"><span class="roman">${cat.roman}</span> ${cat.nome} <span class="cnt">${list.length} processo${list.length>1?'s':''}</span></div>`;
    html += `<div class="cases">${list.map((c,i)=>caseCardHTML(c, curCat!=='todas' && i===0)).join('')}</div>`;
  });
  wrap.innerHTML = html;
}

function switchTab(t) {
  curTab = t;
  document.getElementById('tab-cont').classList.toggle('cur', t==='cont');
  document.getElementById('tab-infr').classList.toggle('cur', t==='infr');
  renderCatBar();
  renderList();
}
function setCat(k) { curCat = k; renderCatBar(); renderList(); }

// ===== Relatório SEAE =====
function listaMinisterios() {
  const set = new Set();
  CASES.forEach(c => (c.minister.split('·')[0].trim()).split('/').forEach(m => set.add(m.trim())));
  INFRACOES.forEach(i => i.ministerios.forEach(m => set.add(m)));
  // normalizar siglas conhecidas
  return [...set].filter(Boolean).sort();
}
function openReport() {
  const sel = document.getElementById('report-min');
  const mins = ['MAEN','MARE','MECT','MF','MTSSS','MECI','MIH','MS','MJ','MAI','MNE','MAM'];
  sel.innerHTML = mins.map(m => `<option value="${m}">${m}</option>`).join('');
  sel.value = 'MAEN';
  generateReport();
  document.getElementById('report-backdrop').classList.add('on');
}
function closeReport() { document.getElementById('report-backdrop').classList.remove('on'); }

function generateReport() {
  const min = document.getElementById('report-min').value;
  const matchMin = (s) => (s||'').toUpperCase().includes(min);
  // Infrações deste ministério
  const infrMin = INFRACOES.filter(i => i.ministerios.includes(min));
  const infrTransp = infrMin.filter(i => i.motivo==='falta_transposicao' && i.fase!=='aguarda_arquivamento' && i.fase!=='arquivado');
  const infrAplic  = infrMin.filter(i => i.motivo==='ma_aplicacao' && i.fase!=='aguarda_arquivamento' && i.fase!=='arquivado');
  const infrArq    = infrMin.filter(i => i.fase==='aguarda_arquivamento' || i.fase==='arquivado');
  // Contencioso judicial deste ministério
  const contMin = CASES.filter(c => matchMin(c.minister));
  const hoje = new Date('2026-05-29').toLocaleDateString('pt-PT');

  const rowsInfr = (arr) => arr.length ? arr.map(i => `
    <div class="rd-row"><div class="rd-ref">${i.ref}</div><div>${i.mat}<br><span style="color:var(--ink-3);font-size:0.74rem">NI ${i.dataNI||'—'}${i.dataPF?' · PF '+i.dataPF:''} · ${i.pontoSit}${i.scoreboard&&i.scoreboard!=='—'?' · '+i.scoreboard:''}</span></div></div>`).join('')
    : '<div class="rd-empty" style="padding:0.4rem 0">Nenhum.</div>';

  const rowsCont = contMin.length ? contMin.map(c => {
    const cat = CATEGORIAS[c.cat]||{};
    return `<div class="rd-row"><div class="rd-ref">${c.id}</div><div>${c.mat}<br><span style="color:var(--ink-3);font-size:0.74rem">Cat. ${cat.roman} · ${PART_LABEL[c.participacao]} · ${c.faseLabel} (${c.dt})</span></div></div>`;
  }).join('') : '<div class="rd-empty" style="padding:0.4rem 0">Nenhum processo judicial em curso.</div>';

  document.getElementById('report-doc').innerHTML = `
    <div style="text-align:center;margin-bottom:1rem">
      <div style="font-weight:700">MINISTÉRIO DOS NEGÓCIOS ESTRANGEIROS</div>
      <div style="font-size:0.78rem;color:var(--ink-3)">Direção-Geral de Direito Europeu e Internacional · DUE</div>
    </div>
    <h3>${min} — Ponto de Situação da Aplicação do Direito da União</h3>
    <div class="rd-meta">Gerado pelo VIGIL · ${hoje} · para reporte à SEAE</div>

    <h3>Procedimentos de Infração <span class="rd-count">${infrTransp.length + infrAplic.length} ativos</span></h3>
    <h4>Por falta de transposição de Diretivas (${infrTransp.length})</h4>
    ${rowsInfr(infrTransp)}
    <h4>Por má aplicação do Direito da União (${infrAplic.length})</h4>
    ${rowsInfr(infrAplic)}
    ${infrArq.length ? `<h4>A aguardar arquivamento (${infrArq.length})</h4>${rowsInfr(infrArq)}` : ''}

    <h3>Contencioso <span class="rd-count">${contMin.length}</span></h3>
    ${rowsCont}

    <h3>Diretivas por transpor</h3>
    <div class="rd-empty" style="padding:0.4rem 0">Dados obtidos automaticamente do módulo RADAR (FICHAS com prazo a correr / ultrapassado sem INFR). Integração em Sprint 7.</div>

    <h3>Regulamentos — pedidos informais ativos da CE</h3>
    <div class="rd-empty" style="padding:0.4rem 0">Sem pedidos informais registados para este ministério.</div>

    <div style="margin-top:1.4rem;padding-top:0.8rem;border-top:1px dashed var(--line-2);font-size:0.72rem;color:var(--ink-4);font-style:italic">
      Este documento é gerado automaticamente a partir dos dados detidos pela plataforma. Substitui o preenchimento manual hoje feito pela DUE/DGDEI para reporte periódico à SEAE. Em produção, exportável em PDF e Word com um clique.
    </div>`;
}

// Expor ao escopo global (onclick inline) — robusto independentemente de Annex B
window.switchTab = switchTab;
window.setCat = setCat;
window.openReport = openReport;
window.closeReport = closeReport;
window.generateReport = generateReport;

switchTab('cont');

}

function openExternal(caseId, piece) {
  alert(`Abertura externa:\n\nSistema DGDEI · processo ${caseId}\nPeça: ${piece}\n\n(Mock — em produção abriria o sistema seguro DGDEI)\n\n✓ Acesso registado em audit_log`);
}
</script>

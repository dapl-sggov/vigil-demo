<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGIL · ADMIN</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Atkinson Hyperlegible',Arial,sans-serif;
  --font-display:'Fraunces',Georgia,serif;
  --font-mono:'JetBrains Mono',Menlo,Consolas,monospace;
  --ink:#1A1815;--ink-2:#3D3A35;--ink-3:#6E6A62;--ink-4:#9A958B;
  --line:#D8D2BF;--line-2:#C2BBA5;
  --paper:#F5F1E8;--paper-2:#FBF8F1;--paper-3:#EDE7D8;--paper-4:#E3DDC9;
  --bg:var(--paper);--bg2:var(--paper-2);--bg3:var(--paper-3);--bg4:var(--paper-4);
  --green:#0E7433;--green-dark:#063D1B;--green-soft:#DCE8DE;
  --blue:#2B5683;--blue-soft:#DDE5EC;
  --red:#A8170E;
  --amber:#A86E10;
  --tint-green:rgba(14,116,51,0.12);
  --tint-amber:rgba(168,110,16,0.14);
  --tint-red:rgba(168,23,14,0.12);
  --tint-blue:rgba(43,86,131,0.12);
  --sh-md:0 8px 24px rgba(26,24,21,0.10);
  --r:4px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.5;}
strong,b{font-weight:700;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-display);letter-spacing:-0.015em;color:var(--ink);}

.skip{position:absolute;top:-100px;left:0;padding:0.7rem 1rem;background:var(--ink);color:var(--paper);font-weight:700;z-index:999;text-decoration:none;}
.skip:focus{top:0;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

.shell{max-width:1280px;margin:0 auto;padding:1.4rem 1.6rem 4rem;}
.site-hdr{display:flex;align-items:center;gap:0.85rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:2px solid var(--ink);}
.brand-mark{width:34px;height:34px;background:var(--ink);border-radius:var(--r);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--paper);}
.brand-mark svg{width:20px;height:20px;}
.brand-bd{flex:1;min-width:0;}
.brand-nm{font-family:var(--font-display);font-weight:900;font-size:1.15rem;letter-spacing:-0.025em;color:var(--ink);}
.brand-sub{font-size:0.72rem;color:var(--ink-3);margin-top:0.1rem;letter-spacing:0.02em;}
.brand-link{font-size:0.74rem;color:var(--ink);text-decoration:none;font-weight:700;padding:0.35rem 0.65rem;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper-2);margin-right:0.55rem;}
.brand-link:hover{background:var(--paper-3);}
.user-chip{display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0.6rem 0.3rem 0.35rem;background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);}
.avatar-sm{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:700;font-family:var(--font-display);}
.user-name-sm{font-size:0.74rem;font-weight:700;color:var(--ink-2);}

.access-denied{padding:3rem 2rem;text-align:center;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);}
.access-denied h2{font-family:var(--font-display);font-size:1.5rem;font-weight:900;margin-bottom:0.85rem;color:var(--red);letter-spacing:-0.02em;}
.access-denied p{color:var(--ink-3);max-width:520px;margin:0 auto 1.6rem;line-height:1.55;}

.hero{padding:1.2rem 0 1.5rem;}
.hero-eye{font-family:var(--font-display);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink);font-weight:800;margin-bottom:0.55rem;}
.hero-h1{font-family:var(--font-display);font-size:2.4rem;font-weight:900;letter-spacing:-0.035em;margin-bottom:0.7rem;line-height:1.02;color:var(--ink);}
.hero-sub{font-size:0.96rem;color:var(--ink-2);max-width:760px;line-height:1.55;}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line-2);margin-bottom:1.5rem;padding-bottom:0;}
.tab{padding:0.75rem 1.1rem;font-family:var(--font-display);font-size:0.88rem;color:var(--ink-3);cursor:pointer;border:none;background:transparent;border-bottom:3px solid transparent;font-weight:700;transition:all 0.12s;margin-bottom:-1px;letter-spacing:0.01em;}
.tab:hover{color:var(--ink);background:var(--paper-2);}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);}

.panel{display:none;}
.panel.on{display:block;}

/* Cards */
.section{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem 1.4rem;margin-bottom:1.1rem;}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.95rem;padding-bottom:0.6rem;border-bottom:1px solid var(--line-2);}
.section-ti{font-family:var(--font-display);font-size:1.05rem;font-weight:800;color:var(--ink);letter-spacing:-0.015em;}
.section-sub{font-size:0.74rem;color:var(--ink-3);}

/* Areas table */
.areas-table{width:100%;font-size:0.86rem;border-collapse:collapse;}
.areas-table thead th{text-align:left;padding:0.6rem 0.8rem;background:var(--paper-3);font-family:var(--font-display);font-size:0.7rem;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:0.1em;border-bottom:1px solid var(--line-2);}
.areas-table tbody td{padding:0.65rem 0.8rem;border-bottom:1px solid var(--line);vertical-align:middle;}
.areas-table tbody tr:hover td{background:var(--paper-3);}
.area-codigo{font-family:var(--font-mono);font-size:0.76rem;color:var(--ink);font-weight:600;letter-spacing:0.02em;}
.area-status{font-family:var(--font-display);font-size:0.62rem;text-transform:uppercase;padding:0.18rem 0.5rem;border-radius:2px;font-weight:800;letter-spacing:0.08em;}
.status-active{background:var(--green);color:var(--paper);}
.status-deprec{background:var(--paper-4);color:var(--ink-3);}

/* Orgânica timeline */
.org-tl{display:flex;flex-direction:column;gap:0.5rem;}
.org-row{position:relative;display:grid;grid-template-columns:130px 1fr 100px 100px 90px;gap:0.9rem;padding:0.8rem 0.95rem;background:var(--paper-3);border-radius:var(--r);align-items:center;font-size:0.86rem;}
.org-row.cur{background:var(--green-soft);border-left:4px solid var(--green);padding-top:1.2rem;}
.org-row.cur::before{content:"VIGENTE";position:absolute;top:0.3rem;right:0.7rem;font-family:var(--font-display);font-size:0.62rem;color:var(--paper);font-weight:800;letter-spacing:0.08em;background:var(--green);padding:0.15rem 0.45rem;border-radius:2px;}
.org-num{font-family:var(--font-mono);font-size:0.8rem;color:var(--ink);font-weight:700;letter-spacing:0.02em;}
.org-nm{color:var(--ink);font-weight:600;}
.org-dl{font-family:var(--font-mono);font-size:0.72rem;color:var(--ink-3);letter-spacing:0.02em;}
.org-min{color:var(--ink-2);text-align:right;font-family:var(--font-mono);font-size:0.76rem;letter-spacing:0.02em;}
.org-act{display:flex;justify-content:flex-end;}

/* Prompts */
.prompt-list{display:flex;flex-direction:column;gap:0.6rem;}
.prompt{display:grid;grid-template-columns:auto 1fr auto auto;gap:0.95rem;padding:0.95rem 1.1rem;background:var(--paper-3);border-radius:var(--r);align-items:center;}
.prompt.active{background:var(--green-soft);border-left:4px solid var(--green);}
.prompt-version{font-family:var(--font-mono);font-size:0.8rem;font-weight:700;color:var(--ink);padding:0.3rem 0.6rem;background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);letter-spacing:0.02em;}
.prompt.active .prompt-version{background:var(--green);color:var(--paper);border-color:var(--green);}
.prompt-bd{}
.prompt-nm{font-family:var(--font-display);font-size:0.92rem;font-weight:800;color:var(--ink);margin-bottom:0.25rem;letter-spacing:-0.01em;}
.prompt-meta{font-size:0.74rem;color:var(--ink-3);}
.prompt-stat{font-size:0.72rem;color:var(--ink-3);text-align:right;font-family:var(--font-mono);}
.prompt-actions{display:flex;gap:0.4rem;}

/* IA quality dashboard */
.ia-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0.9rem;margin-bottom:1.5rem;}
.ia-stat{padding:1.05rem 1.2rem;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);}
.ia-stat-lb{font-family:var(--font-display);font-size:0.66rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3);font-weight:800;margin-bottom:0.55rem;}
.ia-stat-vl{font-family:var(--font-display);font-size:1.85rem;font-weight:900;color:var(--ink);line-height:1;letter-spacing:-0.025em;}
.ia-stat-vl.grn{color:var(--green);}
.ia-stat-vl.amb{color:var(--amber);}
.ia-stat-dt{font-size:0.72rem;color:var(--ink-3);margin-top:0.45rem;}

/* Bar chart simulado */
.barchart{display:flex;align-items:flex-end;gap:0.45rem;height:120px;padding:0.5rem 0;}
.bar{flex:1;background:var(--green);border-radius:2px 2px 0 0;position:relative;min-height:4px;cursor:pointer;border:none;}
.bar:hover{background:var(--green-dark);}
.bar-lb{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:0.66rem;color:var(--ink-3);font-family:var(--font-mono);white-space:nowrap;letter-spacing:0.02em;}

/* User table */
.users-table{width:100%;font-size:0.86rem;border-collapse:collapse;}
.users-table thead th{text-align:left;padding:0.6rem 0.8rem;background:var(--paper-3);font-family:var(--font-display);font-size:0.7rem;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:0.1em;border-bottom:1px solid var(--line-2);}
.users-table tbody td{padding:0.7rem 0.8rem;border-bottom:1px solid var(--line);vertical-align:middle;}
.role-pill{display:inline-block;padding:0.2rem 0.6rem;border-radius:2px;font-family:var(--font-display);font-size:0.66rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;}
.role-admin{background:var(--ink);color:var(--paper);}
.role-dgdei{background:var(--red);color:var(--paper);}
.role-tecnico{background:var(--blue);color:var(--paper);}
.role-gabinete{background:var(--amber);color:var(--paper);}
.role-sggov{background:var(--green);color:var(--paper);}

.btn-mini{padding:0.35rem 0.75rem;font-size:0.74rem;border-radius:var(--r);background:var(--paper-2);border:1px solid var(--line-2);color:var(--ink-2);cursor:pointer;font-family:inherit;font-weight:600;}
.btn-mini:hover{background:var(--paper-4);border-color:var(--ink-3);}
.btn-mini.danger{color:var(--red);}
.btn-mini.danger:hover{background:var(--tint-red);border-color:var(--red);}

.btn{padding:0.6rem 1.2rem;border-radius:var(--r);font-family:var(--font-display);font-size:0.86rem;font-weight:700;cursor:pointer;border:1px solid;display:inline-flex;align-items:center;gap:0.45rem;transition:all 0.12s;letter-spacing:0.01em;}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn-primary:hover{background:var(--green-dark);border-color:var(--green-dark);}
.btn-ghost{background:var(--paper-2);color:var(--ink-2);border-color:var(--line-2);}
.btn-ghost:hover{background:var(--paper-3);border-color:var(--ink-3);}
.btn svg{width:14px;height:14px;}

.toasts{position:fixed;bottom:1.4rem;right:1.4rem;display:flex;flex-direction:column;gap:0.55rem;z-index:99;}
.toast{background:var(--paper-2);border:1px solid var(--line-2);border-left:4px solid var(--green);border-radius:0 var(--r) var(--r) 0;box-shadow:0 12px 28px rgba(26,24,21,0.18);padding:0.7rem 1rem;min-width:280px;animation:toast-in 0.22s;}
.toast-ti{font-family:var(--font-display);font-size:0.84rem;font-weight:800;color:var(--ink);}
.toast-msg{font-size:0.74rem;color:var(--ink-3);margin-top:0.15rem;}
@keyframes toast-in{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

@media (max-width:900px){.ia-stats{grid-template-columns:1fr 1fr;}.org-row{grid-template-columns:1fr;}.hero-h1{font-size:1.9rem;}}
@media (max-width:600px){.shell{padding:1rem 1.1rem 3rem;}.ia-stats{grid-template-columns:1fr;}.hero-h1{font-size:1.55rem;}.tabs{overflow-x:auto;}.tab{flex-shrink:0;}.section{padding:0.95rem 1.05rem;}.prompt{grid-template-columns:1fr;}.areas-table,.users-table{font-size:0.78rem;}.areas-table thead,.users-table thead{display:none;}.areas-table tbody td,.users-table tbody td{padding:0.45rem 0.65rem;}}
</style>
</head>
<body>

<a class="skip" href="#main-content">Saltar para o conteúdo</a>

<div class="shell">

  <header class="site-hdr">
    <div class="brand-mark"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M16 7l-2 2m-8 0L4 7m12 6l-2-2m-8 0l-2 2"/></svg></div>
    <div class="brand-bd"><div class="brand-nm">VIGIL · ADMIN</div><div class="brand-sub">Administração da plataforma · Áreas governativas · Orgânica · Prompts IA · Utilizadores</div></div>
    <a href="hub.html" class="brand-link">← Voltar ao Hub</a>
    <div class="user-chip" aria-label="Sessão activa"><div class="avatar-sm" id="avatar" aria-hidden="true">—</div><span class="user-name-sm" id="user-name">—</span></div>
  </header>

  <main id="main-content">

  <div id="content"></div>

  </main>

</div>

<div class="toasts" id="toasts" role="region" aria-label="Notificações" aria-live="polite"></div>

<script>
const session = (() => { try { return JSON.parse(localStorage.getItem('vigil-demo-session') || 'null'); } catch(e) { return null; } })();
if (!session) { window.location.href = 'index.html'; }
else {
  const initials = session.name.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('avatar').textContent = initials;
  document.getElementById('user-name').textContent = session.name.split(' ')[0];
}

if (session.perfil !== 'admin_dapl' && session.perfil !== 'admin_demo') {
  document.getElementById('content').innerHTML = `
    <div class="access-denied">
      <h2>🔒 Acesso restrito ao Admin DAPL</h2>
      <p>O módulo ADMIN é acessível apenas pelo perfil <strong>Admin DAPL</strong> (administração de plataforma · Filipa Soares). Permite gerir o catálogo de Áreas Governativas, criar nova Orgânica, versionar prompts IA e administrar utilizadores. <strong>Sem interferência em processos.</strong></p>
      <p>O teu perfil actual é <strong>${session.role}</strong>.</p>
      <a href="hub.html" class="brand-link" style="display:inline-block;padding:0.6rem 1.4rem;background:var(--ink);color:#fff;border-radius:7px;text-decoration:none;font-weight:600">← Voltar ao Hub</a>
    </div>
  `;
} else {

document.getElementById('content').innerHTML = `
  <div class="hero">
    <div class="hero-eye">Administração · acesso pleno</div>
    <h1 class="hero-h1">Centro de comando da plataforma</h1>
    <p class="hero-sub">Gestão estrutural do VIGIL · catálogo de Áreas Governativas (sob controlo DAPL · ADR-0019) · ciclo de vida das orgânicas governativas · prompts IA versionados (ADR-0012) · administração de utilizadores e perfis.</p>
  </div>

  <div class="tabs" role="tablist" aria-label="Secções de administração">
    <button class="tab" role="tab" id="t-organica" aria-selected="true" aria-controls="p-organica" tabindex="0" data-tab="organica" onclick="setTab('organica')">Orgânica</button>
    <button class="tab" role="tab" id="t-areas" aria-selected="false" aria-controls="p-areas" tabindex="-1" data-tab="areas" onclick="setTab('areas')">Áreas Governativas</button>
    <button class="tab" role="tab" id="t-prompts" aria-selected="false" aria-controls="p-prompts" tabindex="-1" data-tab="prompts" onclick="setTab('prompts')">Prompts IA</button>
    <button class="tab" role="tab" id="t-ia" aria-selected="false" aria-controls="p-ia" tabindex="-1" data-tab="ia" onclick="setTab('ia')">Qualidade IA</button>
    <button class="tab" role="tab" id="t-users" aria-selected="false" aria-controls="p-users" tabindex="-1" data-tab="users" onclick="setTab('users')">Utilizadores</button>
  </div>

  <!-- ORGÂNICA -->
  <div class="panel on" id="p-organica" role="tabpanel" aria-labelledby="t-organica" data-panel="organica">
    <div class="section">
      <div class="section-h">
        <div>
          <div class="section-ti">Histórico de Orgânicas Constitucionais</div>
          <div class="section-sub">Modelo temporal · uma vigente a cada momento (ADR-0004)</div>
        </div>
        <button class="btn btn-primary" onclick="toast('Workflow iniciado','Painel de reconciliação aberto · 24 processos a re-atribuir')">+ Nova Orgânica</button>
      </div>
      <div class="org-tl">
        <div class="org-row cur">
          <div class="org-num">XXV Governo</div>
          <div class="org-nm">Governo Constitucional · Luís Montenegro (2.º)</div>
          <div class="org-dl">DL 87-A/2025</div>
          <div class="org-min">16 ministérios</div>
          <div class="org-act"><button class="btn-mini">Editar</button></div>
        </div>
        <div class="org-row">
          <div class="org-num">XXIV Governo</div>
          <div class="org-nm">Governo Constitucional · Luís Montenegro (1.º)</div>
          <div class="org-dl">DL 32/2024</div>
          <div class="org-min">17 ministérios</div>
          <div class="org-act"><button class="btn-mini">Ver</button></div>
        </div>
        <div class="org-row">
          <div class="org-num">XXIII Governo</div>
          <div class="org-nm">Governo Constitucional · António Costa (2.ª remodelação)</div>
          <div class="org-dl">DL 60/2022</div>
          <div class="org-min">19 ministérios</div>
          <div class="org-act"><button class="btn-mini">Ver</button></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-h">
        <div>
          <div class="section-ti">Workflow de transição</div>
          <div class="section-sub">Ao criar nova orgânica, o sistema guia a reconciliação dos processos activos</div>
        </div>
      </div>
      <ol style="padding-left:1.2rem;font-size:0.84rem;color:var(--ink-2);line-height:1.7;">
        <li>Carregar DL orgânico (PDF) → preenchimento automático dos metadados</li>
        <li>Criar lista de ministérios com sigla, nome oficial, titular</li>
        <li>Mapear cada ministério a Áreas Governativas (M:N)</li>
        <li>Painel de reconciliação · sistema sugere atribuição de cada processo activo ao novo ministério com base na Área Governativa</li>
        <li>Admin valida caso-a-caso (ambiguidades em divisões/fusões de pastas)</li>
        <li>Confirmação final · transacção: fecha processo_area antigos, cria novos, marca orgânica anterior 'cessado', notifica gabinetes</li>
        <li>Audit log imutável regista toda a transição</li>
      </ol>
    </div>
  </div>

  <!-- ÁREAS -->
  <div class="panel" id="p-areas" role="tabpanel" aria-labelledby="t-areas" data-panel="areas" hidden>
    <div class="section">
      <div class="section-h">
        <div>
          <div class="section-ti">Catálogo de Áreas Governativas</div>
          <div class="section-sub">Estável · só DAPL pode alterar (ADR-0019) · 14 áreas activas</div>
        </div>
        <button class="btn btn-primary" onclick="toast('Procedimento formal iniciado','Justificação escrita exigida antes de aprovar')">+ Nova Área</button>
      </div>
      <table class="areas-table">
        <thead><tr><th>Código</th><th>Designação</th><th>Criada em</th><th>Estado</th><th>Processos</th><th></th></tr></thead>
        <tbody>
          <tr><td><span class="area-codigo">AMBIENTE</span></td><td>Ambiente, conservação da natureza, ordenamento do território</td><td>2002-04-06</td><td><span class="area-status status-active">Activa</span></td><td>14</td><td><button class="btn-mini">Ver</button></td></tr>
          <tr><td><span class="area-codigo">ENERGIA</span></td><td>Política energética, eficiência, renováveis</td><td>2002-04-06</td><td><span class="area-status status-active">Activa</span></td><td>11</td><td><button class="btn-mini">Ver</button></td></tr>

function setTab(name) {
  document.querySelectorAll('.tab').forEach(t => {
    const is = t.dataset.tab === name;
    t.setAttribute('aria-selected', is ? 'true' : 'false');
    t.setAttribute('tabindex', is ? '0' : '-1');
  });
  document.querySelectorAll('.panel').forEach(p => {
    const is = p.dataset.panel === name;
    p.classList.toggle('on', is);
    if (is) p.removeAttribute('hidden'); else p.setAttribute('hidden', '');
  });
}

document.querySelectorAll('[role="tablist"] [role="tab"]').forEach((tab, idx, all) => {
  tab.addEventListener('keydown', (e) => {
    let next = null;
    if (e.key === 'ArrowRight') next = all[(idx + 1) % all.length];
    else if (e.key === 'ArrowLeft') next = all[(idx - 1 + all.length) % all.length];
    else if (e.key === 'Home') next = all[0];
    else if (e.key === 'End') next = all[all.length - 1];
    if (next) {
      e.preventDefault();
      setTab(next.dataset.tab);
      next.focus();
    }
  });
});

function toast(ti, msg) {
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="toast-ti">${ti}</div><div class="toast-msg">${msg||''}</div>`;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
